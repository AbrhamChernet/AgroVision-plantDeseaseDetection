server {
    listen __PORT__;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for high-speed page loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Single Page Application routing: all subroutes route to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API requests
    location /api/ {
        proxy_pass __BACKEND_URL__/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for static uploaded leaf images
    location /uploads/ {
        proxy_pass __BACKEND_URL__/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Allow leaf uploads up to 20MB
    client_max_body_size 20M;
}
